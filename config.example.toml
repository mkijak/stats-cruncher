# stats-cruncher job configuration
#
# Passed to the binary via `--config job.toml`. Describes where the data comes
# from, how the engine should crunch it, where the HTTP API binds, and which
# columns are kept in the in-memory store.

# --- source -------------------------------------------------------------------
# Where the raw data is pulled from. Pick exactly one `type`.

[source]
# CSV file on disk. Set `gzip = true` if the file is gzip-compressed.
# Use the first row for headers.
type = "csv"
path = "/var/data/events.csv.gz"
delimiter = ","   # optional, defaults to ','; use "\t" (double-quoted) for tab
gzip = true

# Alternative: SQLite table. Comment the block above and uncomment below.
# [source]
# type  = "sqlite"
# path  = "/var/data/events.db"
# table = "events"

# --- engine -------------------------------------------------------------------
# Performance tuning.

[engine]
# Hard RAM ceiling for the columnar store. Exceeding it during ingestion is a
# fatal error — pick a value that leaves headroom for the OS and the Tokio pool.
# Accepts a raw byte count or a suffixed string; suffixes are base-1024
# (so `8G` / `8GB` / `8GiB` all mean 8 * 1024^3 bytes).
# Supported suffixes: K/KB/KiB, M/MB/MiB, G/GB/GiB, T/TB/TiB (case-insensitive).
memory_limit = "8GiB"

# Rows per morsel dispatched to a worker. Smaller = better load balancing but
# more scheduling overhead; larger = less overhead but coarser parallelism.
chunk_size_rows = 65_536

# The size of the dedicated compute pool used for query execution.
# This defines the number of physical CPU cores the application will dedicate
# to data crunching (note that asynchronous HTTP request handlers may cause total
# thread usage to slightly exceed this limit). In a heavy load scenarios leave
# at least 1-2 cores free for other processes.
worker_threads = 2

# --- api ----------------------------------------------------------------------
# HTTP surface exposing /status and /query.

[api]
bind = "0.0.0.0:8080"

# --- searchable columns -------------------------------------------------------
# Whitelist of columns pulled off disk. Anything not listed here is dropped
# during ingestion. Each entry declares the column's logical type.
#
# Supported `type` values:
#   integer   — 64-bit signed int
#   float     — 64-bit float
#   string    — dictionary-encoded; supports must / must_not filters
#   date-time — RFC3339 on the wire (e.g. "2026-04-19T00:00:00Z"); stored
#               internally as epoch-seconds UTC; supports range filters

[searchable.user_id]
type = "integer"

[searchable.amount]
type = "float"

[searchable.country]
type = "string"

[searchable.event_type]
type = "string"

[searchable.occurred_at]
type = "date-time"

# --- partition column (optional) ----------------------------------------------
# For typical OLAP queries aiming at getting statistics for specific date-time
# ranges, providing a column name in partition_column significantly speeds up
# processing. Numeric types (integer, float) are also supported.

# partition_column = "occurred_at"